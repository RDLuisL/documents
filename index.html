<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="menu.css"
    >

    <link rel="icon" type="image/x-icon" href="./favicon.ico">

    <title>Luis Luna</title>

</head>


<body>


    <!-- Fondo -->

    <div class="background-overlay"></div>



    <!-- ===================================== -->
    <!-- MENÚ PRINCIPAL -->
    <!-- ===================================== -->

    <main class="menu">


        <!-- ================================= -->
        <!-- ENCABEZADO -->
        <!-- ================================= -->

        <header class="menu__header">

            <div class="menu__logo">
                ⚙️
            </div>

            <h1>
                Luis Antonio Luna
            </h1>

            <p>
                Selecciona una opción para continuar
            </p>

        </header>



        <!-- ================================= -->
        <!-- OPCIONES -->
        <!-- ================================= -->

        <nav class="menu__options">


            <!-- DATOS PERSONALES -->

            <a
                href="./datos.html"
                class="menu-button"
            >

                <span class="menu-button__icon">
                    👤
                </span>


                <span class="menu-button__content">

                    <strong>
                        Datos personales
                    </strong>

                    <small>
                        Información de contacto
                    </small>

                </span>


                <span class="menu-button__arrow">
                    ›
                </span>

            </a>



            <!-- DOCUMENTOS -->

            <button
                id="documentsButton"
                class="menu-button"
                type="button"
            >

                <span class="menu-button__icon">
                    📄
                </span>


                <span class="menu-button__content">

                    <strong>
                        Documentos
                    </strong>

                    <small>
                        Currículum y certificaciones
                    </small>

                </span>


                <span class="menu-button__arrow">
                    ›
                </span>

            </button>


        </nav>



        <!-- ================================= -->
        <!-- PIE -->
        <!-- ================================= -->

        <footer class="menu__footer">

            <span>
                ⚙
            </span>

            Portal personal

        </footer>


    </main>



    <!-- ===================================== -->
    <!-- MODAL DE ACCESO -->
    <!-- ===================================== -->

    <div
        class="pin-modal"
        id="pinModal"
        aria-hidden="true"
    >


        <!-- FONDO -->

        <div
            class="pin-modal__backdrop"
            id="pinBackdrop"
        ></div>



        <!-- CAJA -->

        <div
            class="pin-modal__box"
            role="dialog"
            aria-modal="true"
            aria-labelledby="pinTitle"
        >


            <!-- CERRAR -->

            <button
                id="closePinModal"
                class="pin-modal__close"
                type="button"
                aria-label="Cerrar"
            >
                ×
            </button>



            <!-- ICONO -->

            <div class="pin-modal__icon">
                🔒
            </div>



            <!-- TÍTULO -->

            <h2 id="pinTitle">
                Acceso protegido
            </h2>


            <p class="pin-modal__description">
                Ingresa tu clave de acceso para abrir los documentos.
            </p>



            <!-- FORMULARIO -->

            <form id="pinForm">


                <label
                    class="pin-label"
                    for="pinInput"
                >
                    Clave de acceso
                </label>


                <input
                    id="pinInput"
                    class="pin-input"
                    type="password"
                    inputmode="numeric"
                    pattern="[0-9]*"
                    maxlength="6"
                    autocomplete="off"
                    placeholder="••••••"
                    aria-describedby="pinMessage"
                >



                <!-- MENSAJE -->

                <p
                    class="pin-message"
                    id="pinMessage"
                    aria-live="polite"
                ></p>



                <!-- ENTRAR -->

                <button
                    class="pin-submit"
                    type="submit"
                >

                    <span>
                        🔓
                    </span>

                    Ingresar

                </button>


            </form>


        </div>

    </div>



    <script src="menu.js"></script>


</body>

</html>
