<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <!-- GOOGLE FONT -->

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- CSS -->

    <link
        rel="stylesheet"
        href="style.css"
    >


    <title>
        Documentos de Luis Luna
    </title>

</head>


<body>


    <!-- ===================================== -->
    <!-- CAPA SOBRE EL BACKGROUND -->
    <!-- ===================================== -->

    <div class="background-overlay"></div>



    <!-- ===================================== -->
    <!-- CONTENIDO PRINCIPAL -->
    <!-- ===================================== -->

    <main class="wrapper">


        <!-- ================================= -->
        <!-- ENCABEZADO -->
        <!-- ================================= -->

        <header class="page-header">


            <div class="page-header__icon">
                ⚙️
            </div>


            <div class="page-header__content">


                <h1 class="page-header__title">

                    Documentos de Luis Luna

                </h1>


                <p class="page-header__subtitle">

                    Documentación profesional y certificaciones

                </p>


            </div>


        </header>



        <!-- ================================= -->
        <!-- CARRUSEL -->
        <!-- ================================= -->

        <section class="carousel-area">


            <div
                class="carousel"
                id="carousel"
            >

                <!--
                    Las tarjetas se generan
                    automáticamente desde data.js
                -->

            </div>


        </section>



        <!-- ================================= -->
        <!-- PREVIEW -->
        <!-- ================================= -->

        <section
            class="preview"
            id="preview"
        >


            <!-- CABECERA PREVIEW -->

            <div class="preview__header">


                <span
                    class="preview__icon"
                    id="previewIcon"
                >
                    📄
                </span>


                <span
                    class="preview__title"
                    id="previewTitle"
                >
                    Documento
                </span>


            </div>



            <!-- CONTENIDO PREVIEW -->

            <div
                class="preview__content"
                id="previewContent"
            >
            </div>


        </section>



        <!-- ================================= -->
        <!-- CONTADOR DE SELECCIONADOS -->
        <!-- ================================= -->

        <div class="selection-info">


            <span class="selection-info__icon">
                ☑
            </span>


            <span id="selectedCount">

                0 documentos seleccionados

            </span>


        </div>



        <!-- ================================= -->
        <!-- BOTÓN ENVIAR -->
        <!-- ================================= -->

        <button
            id="sendButton"
            class="send-button"
            type="button"
            disabled
        >


            <span class="send-button__icon">

                ➤

            </span>


            <span>

                Enviar documentos

            </span>


        </button>


    </main>



    <!-- ===================================== -->
    <!-- MODAL COMPARTIR -->
    <!-- ===================================== -->

    <div
        class="modal"
        id="sendModal"
        aria-hidden="true"
    >


        <!-- FONDO OSCURO DEL MODAL -->

        <div class="modal__backdrop"></div>



        <!-- CAJA MODAL -->

        <div class="modal__box">


            <!-- CERRAR -->

            <button
                class="modal__close"
                id="closeModal"
                type="button"
                aria-label="Cerrar"
            >

                ×

            </button>



            <!-- ICONO -->

            <div class="modal__badge">

                ⚙️

            </div>



            <!-- TÍTULO -->

            <h2>

                Compartir documentos

            </h2>



            <p class="modal__description">

                Revisa los documentos seleccionados
                y desliza el control para compartirlos.

            </p>



            <!-- ================================= -->
            <!-- LISTA DE DOCUMENTOS -->
            <!-- ================================= -->

            <div
                class="modal__selected"
                id="modalSelected"
            >
            </div>



            <!-- ================================= -->
            <!-- SLIDER COMPARTIR -->
            <!-- ================================= -->

            <div
                class="share-slider"
                id="shareSlider"
            >


                <div
                    class="share-slider__track"
                    id="shareTrack"
                >


                    <span class="share-slider__text">

                        Desliza para compartir

                    </span>



                    <button
                        class="share-slider__handle"
                        id="shareHandle"
                        type="button"
                        aria-label="Deslizar para compartir"
                    >

                        ↗

                    </button>


                </div>


            </div>


        </div>


    </div>



    <!-- ===================================== -->
    <!-- JAVASCRIPT -->
    <!-- ===================================== -->

    <!-- IMPORTANTE:
         data.js siempre debe cargarse
         ANTES de app.js
    -->

    <script src="data.js"></script>

    <script src="app.js"></script>


</body>

</html>
