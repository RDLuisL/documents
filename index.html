<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <link
        rel="preconnect"
        href="https://fonts.googleapis.com"
    >

    <link
        rel="preconnect"
        href="https://fonts.gstatic.com"
        crossorigin
    >

    <link
        href="https://fonts.googleapis.com/css2?family=Work+Sans:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <title>Documentos de Luis Luna</title>

</head>


<body>


    <!-- CAPA OSCURA SOBRE EL METAL -->
    <div class="background-overlay"></div>



    <main class="wrapper">


        <!-- ================================= -->
        <!-- ENCABEZADO -->
        <!-- ================================= -->

        <header class="page-header">

            <div class="page-header__icon">
                ⚙️
            </div>


            <div>

                <h1 class="page-header__title">
                    Documentos de Luis Luna
                </h1>

                <p class="page-header__subtitle">
                    Documentación profesional y certificaciones
                </p>

            </div>

        </header>



        <!-- ================================= -->
        <!-- CARRUSEL -->
        <!-- ================================= -->

        <section class="carousel-area">

            <div
                class="carousel"
                id="carousel"
            >
                <!-- JavaScript genera las tarjetas -->
            </div>

        </section>



        <!-- ================================= -->
        <!-- PREVIEW -->
        <!-- ================================= -->

        <section
            class="preview"
            id="preview"
        >

            <div class="preview__header">

                <span
                    class="preview__icon"
                    id="previewIcon"
                >
                    📄
                </span>


                <span
                    class="preview__title"
                    id="previewTitle"
                >
                    Documento
                </span>

            </div>


            <div
                class="preview__content"
                id="previewContent"
            >
            </div>

        </section>



        <!-- ================================= -->
        <!-- DOCUMENTOS SELECCIONADOS -->
        <!-- ================================= -->

        <div class="selection-info">

            <span class="selection-info__icon">
                ☑
            </span>

            <span id="selectedCount">
                0 documentos seleccionados
            </span>

        </div>



        <!-- ================================= -->
        <!-- BOTÓN ENVIAR -->
        <!-- ================================= -->

        <button
            id="sendButton"
            class="send-button"
            type="button"
            disabled
        >

            <span class="send-button__icon">
                ➤
            </span>

            <span>
                Enviar documentos
            </span>

        </button>


    </main>



    <!-- ================================= -->
    <!-- MODAL DE ENVÍO -->
    <!-- ================================= -->

    <div
        class="modal"
        id="sendModal"
        aria-hidden="true"
    >

        <div class="modal__backdrop"></div>


        <div class="modal__box">


            <button
                class="modal__close"
                id="closeModal"
                type="button"
                aria-label="Cerrar"
            >
                ×
            </button>


            <div class="modal__badge">
                ⚙️
            </div>


            <h2>
                Enviar documentos
            </h2>


            <p class="modal__description">
                Selecciona cómo deseas compartir
                los documentos elegidos.
            </p>


            <div
                class="modal__selected"
                id="modalSelected"
            >
            </div>


            <div class="modal__actions">


                <button
                    id="sendWhatsApp"
                    class="share-button share-button--whatsapp"
                    type="button"
                >

                    <span>💬</span>

                    WhatsApp

                </button>


                <button
                    id="sendEmail"
                    class="share-button share-button--email"
                    type="button"
                >

                    <span>✉️</span>

                    Correo

                </button>


            </div>

        </div>

    </div>



    <!-- ================================= -->
    <!-- JAVASCRIPT -->
    <!-- ================================= -->

    <script src="data.js"></script>

    <script src="app.js"></script>


</body>

</html>
